  <!-- Main Content -->
  <main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-12">

    <!-- Header & Search -->
    <div class="mb-12 flex flex-col md:flex-row md:items-center justify-between gap-6">
      <div class="flex items-center gap-4">
        <a href="dashboard.html" class="w-10 h-10 rounded-lg bg-surface-card border border-surface-bright flex items-center justify-center text-on-surface hover:text-primary hover:border-primary-container transition-colors group">
          <span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
        </a>
        <div>
          <h1 class="font-headline-lg text-headline-lg text-on-surface">Rekap Kehadiran Siswa</h1>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-primary-container/20 text-primary border border-primary/30 ml-3">
            <span class="material-symbols-outlined text-[14px] mr-1">admin_panel_settings</span>
            Admin View
          </span>
          <p class="font-body-md text-body-md text-on-surface-variant mt-1">Kelas XII PPLG &bull; 35 Siswa</p>

      <div class="relative w-full md:w-96">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="material-symbols-outlined text-outline">search</span>
        </div>
        <input id="searchInput" type="text" onkeyup="searchCardSiswa()"
               class="block w-full pl-10 pr-3 py-3 border border-surface-bright rounded-xl leading-5 bg-[#020617] text-on-surface placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container font-body-md transition-all"

    <!-- Student List Grid -->
    <div id="studentList" class="grid grid-cols-1 gap-4">
      <div class="text-center py-12 text-on-surface-variant bg-surface-card border border-surface-bright rounded-xl">

  <!-- Load API_URL -->
  <script src="config.js"></script>

  <script>
    const masterSiswa35 = [
      { nama: "ADILLA PANCA MITANO" },
      { nama: "AGUNG LUTFIANA" },
      { nama: "AHMAD RAMDANI" },
      { nama: "AKMAL AZMI ATHALLAH" },
      { nama: "ANDRI MAULANA" },
      { nama: "ARINIE RIZKYA PUTRI" },
      { nama: "ARKHAN MUMTADZ RAMADHAN" },
      { nama: "DAVIN NIZAR AL JABAR JUANDA" },
      { nama: "DEVITA FEBRIYANTI MAULIDIA" },
      { nama: "DIMAS RAMDHANI HARRY MAHARDIKA" },
      { nama: "DINDA TIARA FITRIANI" },
      { nama: "DINI TRI HANDAYANI" },
      { nama: "EFRANDA GISELLA PRAMITHA" },
      { nama: "FADIEL FADILAH" },
      { nama: "FARHANUL HUSNA WILIANA" },
      { nama: "FAZRIL HADAD ASIFA" },
      { nama: "HIZRA DWI GUNA" },
      { nama: "IQBAL FATRIA GUMIWANG" },
      { nama: "JIHAN NURUNNAFISAH" },
      { nama: "KAYSAN BENZEMA" },
      { nama: "MUHAMAD BIAN PRAWIRA" },
      { nama: "MUHAMAD FAHRI ILHAM" },
      { nama: "MUHAMMAD IKHSAN KHAIRUL AZMI" },
      { nama: "MUHAMMAD TEUNGKU RAFHA ISMAIL" },
      { nama: "NAYLA SYIFA FAWWAZYAH" },
      { nama: "NURUL FAZRIL ARIFIN" },
      { nama: "RADEVINOV HERU RAMANDA FADILAH" },
      { nama: "RAIFAL ADITIA NUGRAHA" },
      { nama: "RAIVANKA AL MUZAQI" },
      { nama: "REYHAN ARI WIJAYA" },
      { nama: "RISKI MAULID SIDIQ" },
      { nama: "RIFAL MUHAMAD ADITYA" },
      { nama: "ROUDOTUN NISA" },
      { nama: "SATRIA PUTRA NUR ROCHMAN" },
      { nama: "SITI SOLIHAH NURPADILLAH" }
    ];

    const namaBulanList = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const hariMap = { 1: "Sen", 2: "Sel", 3: "Rab", 4: "Kam", 5: "Jum" };

    async function initListSiswa() {
      try {
        const res = await fetch(API_URL + "?action=getDetailRekap");
        const rekapAbsen = await res.json();
        renderUI(masterSiswa35, Array.isArray(rekapAbsen) ? rekapAbsen : []);
      } catch (err) {
        console.error("Error loading rekap:", err);
        renderUI(masterSiswa35, []);
      }
    }

    function getBadgeClass(status) {
      switch (status) {
        case "Hadir": return "bg-tertiary-container/20 text-tertiary-fixed border-tertiary/30";
        case "Terlambat": return "bg-error-container/20 text-error border-error/30";
        case "Sakit": return "bg-secondary-container/20 text-secondary border-secondary/30";
        case "Izin": return "bg-surface-variant text-on-surface-variant border-surface-bright";
        case "Alpa": return "bg-error-vibrant/20 text-error-vibrant border-error-vibrant/30";
        default: return "bg-surface-variant text-on-surface-variant border-surface-bright";
      }
    }

    function getBadgeLabel(status) {
      switch (status) {
        case "Hadir": return "H";
        case "Terlambat": return "T";
        case "Sakit": return "S";
        case "Izin": return "I";
        case "Alpa": return "A";
        default: return "-";
      }
    }

    function renderUI(masterSiswa, rekapAbsen) {
      var container = document.getElementById("studentList");
      container.innerHTML = "";

      var tglUnik = [];
      var tglSet = {};
      rekapAbsen.forEach(function (r) {
        var t = String(r.tanggal || "").split("T")[0];
        if (t && !tglSet[t]) { tglSet[t] = true; tglUnik.push(t); }
      });
      var totalHariEfektif = tglUnik.length > 0 ? tglUnik.length : 1;

      var dbRekap = {};
      rekapAbsen.forEach(function (item) {
        if (!item.tanggal || !item.nama) return;
        var cleanTgl = String(item.tanggal).split("T")[0].trim();
        var parts = cleanTgl.includes("-") ? cleanTgl.split("-") : cleanTgl.split("/");
        var year, monthIdx, dayNum;
        if (parts[0].length === 4) {
          year = parseInt(parts[0]); monthIdx = parseInt(parts[1]) - 1; dayNum = parseInt(parts[2]);
        } else {
          dayNum = parseInt(parts[0]); monthIdx = parseInt(parts[1]) - 1; year = parseInt(parts[2]);
        }
        var d = new Date(year, monthIdx, dayNum);
        if (isNaN(d.getTime())) return;
        var namaKey = String(item.nama).trim().toUpperCase();
        var dayOfWeek = d.getDay();
        var mingguKe = Math.min(Math.ceil(dayNum / 7), 4);
        if (!dbRekap[namaKey]) dbRekap[namaKey] = {};
        if (!dbRekap[namaKey][year]) dbRekap[namaKey][year] = {};
        if (!dbRekap[namaKey][year][monthIdx]) dbRekap[namaKey][year][monthIdx] = {};
        if (!dbRekap[namaKey][year][monthIdx][mingguKe]) dbRekap[namaKey][year][monthIdx][mingguKe] = {};
        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
          dbRekap[namaKey][year][monthIdx][mingguKe][dayOfWeek] = item.status || "Hadir";
        }
      });

      var currentYear = new Date().getFullYear();
      var currentMonth = new Date().getMonth();

      masterSiswa.forEach(function (siswa, index) {
        var namaKey = String(siswa.nama).trim().toUpperCase();
        var riwayat = rekapAbsen.filter(function (r) { return String(r.nama).trim().toUpperCase() === namaKey; });
        var totalHadir = riwayat.filter(function (r) { return r.status === "Hadir" || r.status === "Terlambat"; }).length;
        var persen = Math.round((totalHadir / totalHariEfektif) * 100);
        var initial = siswa.nama.charAt(0);

        var weekHTML = "";
        for (var w = 1; w <= 4; w++) {
          weekHTML += '<div class="flex flex-col gap-2"><div class="text-xs font-label-sm text-on-surface-variant uppercase tracking-wider">Minggu ' + w + '</div><div class="grid grid-cols-5 gap-1">';
          [1, 2, 3, 4, 5].forEach(function (dayNum) {
            var statusText = "-";
            if (dbRekap[namaKey] && dbRekap[namaKey][currentYear] && dbRekap[namaKey][currentYear][currentMonth] && dbRekap[namaKey][currentYear][currentMonth][w] && dbRekap[namaKey][currentYear][currentMonth][w][dayNum]) {
              statusText = dbRekap[namaKey][currentYear][currentMonth][w][dayNum];
            }
            weekHTML += '<div class="px-2 py-1 rounded text-xs font-semibold border ' + getBadgeClass(statusText) + ' text-center flex items-center justify-center">' + getBadgeLabel(statusText) + '</div>';
          });
          weekHTML += "</div></div>";
        }

        var monthOptions = "";
        namaBulanList.forEach(function (b, i) {
          monthOptions += '<option value="' + i + '"' + (i === currentMonth ? " selected" : "") + ">" + b + "</option>";
        });

        var html = '<div class="accordion-item item-siswa bg-surface-card rounded-xl border border-border-glow hover:border-primary-container transition-colors duration-300">' +
          '<button class="w-full px-6 py-5 flex items-center justify-between focus:outline-none" onclick="this.parentElement.classList.toggle(\'active\')">' +
            '<div class="flex items-center gap-4">' +
              '<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-primary font-bold text-sm">' + initial + '</div>' +
              '<div class="text-left">' +
                '<h3 class="font-label-md text-label-md text-on-surface nama-siswa">' + siswa.nama + '</h3>' +
                '<p class="text-xs text-on-surface-variant mt-0.5">Siswa #' + (index + 1) + '</p>' +
              '</div>' +
            '</div>' +
            '<div class="flex items-center gap-6">' +
              '<div class="hidden md:flex flex-col items-end">' +
                '<span class="font-label-sm text-label-sm ' + (persen >= 75 ? "text-tertiary" : "text-error") + '">' + persen + '% Kehadiran</span>' +
                '<div class="w-24 h-1.5 bg-surface-variant rounded-full mt-1 overflow-hidden">' +
                  '<div class="h-full ' + (persen >= 75 ? "bg-tertiary" : "bg-error") + '" style="width:' + persen + '%"></div>' +
                '</div>' +
              '</div>' +
              '<span class="material-symbols-outlined text-outline-variant accordion-icon transition-transform duration-300">expand_more</span>' +
            '</div>' +
          '</button>' +
          '<div class="accordion-content border-t border-surface-bright/50">' +
            '<div class="p-6">' +
              '<div class="flex flex-col md:flex-row gap-8">' +
                '<div class="w-full md:w-48 flex-shrink-0 flex flex-col gap-4">' +
                  '<div class="glass-panel p-4 rounded-lg">' +
                    '<div class="text-xs text-on-surface-variant uppercase tracking-wider mb-2">Tahun</div>' +
                    '<select class="w-full bg-[#020617] border border-surface-bright rounded text-sm text-on-surface focus:ring-primary-container p-2"><option>' + currentYear + '</option></select>' +
                  '</div>' +
                  '<div class="glass-panel p-4 rounded-lg">' +
                    '<div class="text-xs text-on-surface-variant uppercase tracking-wider mb-2">Bulan</div>' +
                    '<select class="w-full bg-[#020617] border border-surface-bright rounded text-sm text-on-surface focus:ring-primary-container p-2">' + monthOptions + '</select>' +
                  '</div>' +
                '</div>' +
                '<div class="flex-grow grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">' + weekHTML + '</div>' +
              '</div>' +
              '<div class="mt-8 pt-4 border-t border-surface-bright/30 flex flex-wrap gap-4 text-xs font-label-sm">' +
                '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-tertiary"></span> Hadir</div>' +
                '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-error"></span> Terlambat</div>' +
                '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-secondary"></span> Sakit</div>' +
                '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-surface-variant border border-surface-bright"></span> Izin</div>' +
                '<div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-error-vibrant"></span> Alpa</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';

        container.innerHTML += html;
      });
    }

    function searchCardSiswa() {
      var query = document.getElementById("searchInput").value.toLowerCase();
      var items = document.querySelectorAll(".item-siswa");
      items.forEach(function (item) {
        var nama = item.querySelector(".nama-siswa").textContent.toLowerCase();
        item.style.display = nama.includes(query) ? "" : "none";
      });
    }

    document.addEventListener("DOMContentLoaded", initListSiswa);
  </script>
</body>
</html>
