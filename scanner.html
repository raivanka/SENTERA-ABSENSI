<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kios Scanner Absensi - Senexus</title>

  <!-- PROTEKSI ROUTE GUARD (HANYA ADMIN) -->
  <script>
    if (!localStorage.getItem("sessionToken") || localStorage.getItem("userRole") !== "admin") {
      alert("Akses Ditolak! Halaman scanner hanya dapat diaktifkan oleh Admin/Petugas.");
      window.location.replace("login.html");
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    @keyframes scan-line-anim {
      0% { top: 0; opacity: 0; }
      8% { opacity: 1; }
      50% { top: calc(100% - 2px); opacity: 1; }
      92% { opacity: 1; }
      100% { top: 0; opacity: 0; }
    }
    #scan-line {
      animation: scan-line-anim 4s ease-in-out infinite;
      position: absolute;
      left: 2px;
    }
    #reader video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Background decorative circles -->
  <div class="absolute top-[-150px] right-[-80px] w-[250px] h-[250px] bg-emerald-500/10 rounded-full blur-[80px] -z-10 pointer-events-none sm:w-[350px] sm:h-[350px]"></div>
  <div class="absolute bottom-0 left-[-120px] w-[280px] h-[280px] bg-teal-400/10 rounded-full blur-[90px] -z-10 pointer-events-none sm:w-[400px] sm:h-[400px]"></div>

  <!-- HEADER -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/80 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">📷</span>
      <div>
        <h1 class="font-bold text-lg text-white">KIOS SCANNER <span class="text-primary">SENEXUS</span></h1>
        <p class="text-[10px] text-slate-400">Pos Presensi Kehadiran Siswa</p>
      </div>
    </div>
    
    <!-- Akses Dashboard Admin / Logout -->
    <div class="flex items-center gap-2">
      <a href="dashboard.html" class="flex flex-col sm:flex-row items-center justify-center gap-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-xs text-slate-200 px-3 py-2 rounded-xl transition">
          <span>📊</span>
          <span>Dashboard</span>
      </a>
      <button onclick="logoutAdmin()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 text-xs px-3 py-2 rounded-xl transition">
        🚪 Keluar
      </button>
    </div>
  </header>

  <!-- SCANNER CONTAINER -->
  <main class="max-w-md w-full mx-auto px-4 py-8">
    <div class="bg-slate-800 rounded-3xl p-6 border border-slate-700 shadow-2xl space-y-4">
      <div class="text-center">
        <h2 class="text-xl font-bold text-primary">Scan QR Code Absensi</h2>
        <p class="text-xs text-slate-400 mt-1">Arahkan QR Code Kartu Siswa ke Kamera</p>
      </div>

      <!-- Video Box -->
      <div id="reader" class="overflow-hidden rounded-2xl border-2 border-dashed border-emerald-500/40 bg-slate-950 min-h-[400px] flex items-center justify-center relative">
        <div class="text-center text-slate-400" id="reader-placeholder">
          <span class="material-symbols-outlined text-4xl mb-2 opacity-30">qr_code_scanner</span>
          <p class="text-xs">Area pemindai QR akan muncul di sini</p>
        </div>
        <!-- Start Camera Button (untuk mobile gesture requirement) -->
        <button id="start-camera-btn" onclick="startScannerWithGesture()" class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 bg-slate-800/50 hover:bg-slate-700/60 border-2 border-dashed border-emerald-500/30 rounded-2xl transition-all cursor-pointer group">
          <span class="material-symbols-outlined text-5xl text-emerald-400 group-hover:scale-110 transition-transform">camera_alt</span>
          <span class="text-sm font-medium text-slate-200">Klik / Ketuk untuk Mulai Scanner</span>
          <span class="text-xs text-slate-400">Izinkan akses kamera saat diminta</span>
        </button>
        <!-- Scan Frame Overlay -->
        <div id="scan-frame" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-[250px] h-[250px] sm:w-[280px] sm:h-[280px] border-2 border-emerald-400/40 rounded-[20px] shadow-2xl pointer-events-none hidden">
          <div class="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 border-emerald-400 rounded-tl-[10px]"></div>
          <div class="absolute top-0 right-0 w-6 h-6 border-t-2 border-r-2 border-emerald-400 rounded-tr-[10px]"></div>
          <div class="absolute bottom-0 left-0 w-6 h-6 border-b-2 border-l-2 border-emerald-400 rounded-bl-[10px]"></div>
          <div class="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-emerald-400 rounded-br-[10px]"></div>
          <div id="scan-line" class="absolute left-[2px] top-0 w-[246px] sm:w-[276px] h-0.5 bg-emerald-400 shadow-lg rounded-full"></div>
        </div>
        <!-- Flip Camera Button -->
        <button id="flip-camera-btn" onclick="flipCamera()" class="absolute top-3 right-3 z-20 bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-slate-200 rounded-full w-9 h-9 flex items-center justify-center transition-all shadow-lg">
          <span class="material-symbols-outlined text-base">cameraswitch</span>
        </button>
        <!-- Camera Status -->
        <div id="camera-status" class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 bg-slate-800/80 px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-lg">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="camera-label" class="text-xs text-slate-400">Belakang</span>
        </div>
      </div>

      <!-- Status Notifikasi -->
      <div id="status-box" class="hidden p-4 rounded-xl text-center font-medium transition-all text-sm">
        <p id="status-text"></p>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-500">
    &copy; 2026 E-Absensi Senexus System
  </footer>

  <!-- LOGIC SCANNER SCRIPT -->
  <script src="scanner.js"></script>
  
  <script>
    function logoutAdmin() {
      localStorage.clear();
      window.location.replace("index.html");
    }
  </script>
</body>
</html>
