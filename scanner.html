<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kios Scanner Absensi - E-Absensi Sentera</title>

  <!-- PROTEKSI ROUTE GUARD (HANYA ADMIN) -->
  <script>
    if (!localStorage.getItem("sessionToken") || localStorage.getItem("userRole") !== "admin") {
      alert("Akses Ditolak! Halaman scanner hanya dapat diaktifkan oleh Admin/Petugas.");
      window.location.replace("login.html");
    }
  </script>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <style>
    body { 
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Animasi Laser Scanner */
    @keyframes scan-line-anim {
      0% { top: 10px; opacity: 0; }
      15% { opacity: 1; }
      50% { top: calc(100% - 10px); opacity: 1; }
      85% { opacity: 1; }
      100% { top: 10px; opacity: 0; }
    }
    #scan-line {
      animation: scan-line-anim 3s ease-in-out infinite;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 dark:bg-zinc-950 dark:text-slate-100 antialiased min-h-screen flex flex-col justify-between font-body-md">

  <!-- Header Dynamic -->
  <header class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-slate-200 dark:border-zinc-800 shadow-sm z-50 sticky top-0 transition-colors">
    <div class="flex justify-between items-center px-5 md:px-8 w-full max-w-[1280px] mx-auto h-20">
      
      <!-- Logo Dynamic -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='index.html'">
        <div class="h-10 w-10 sm:h-11 sm:w-11 rounded-2xl bg-gradient-to-tr from-teal-600 via-teal-500 to-emerald-400 flex items-center justify-center text-white shadow-md shadow-teal-500/20 active:scale-95 transition-all duration-150">
          <span class="material-symbols-outlined text-2xl sm:text-3xl">qr_code_scanner</span>
        </div>
        <div>
          <span class="text-base md:text-xl font-bold tracking-tight text-slate-900 dark:text-white">
            KIOS SCANNER <span class="text-teal-600 dark:text-teal-400">SENTERA</span>
          </span>
          <p class="text-[10px] font-mono text-slate-400 dark:text-zinc-500 hidden sm:block">Pos Presensi Kehadiran Siswa</p>
        </div>
      </div>

      <!-- Actions Header -->
      <div class="flex items-center gap-2 md:gap-3">
        <!-- Theme Toggle -->
        <button id="theme-toggle" onclick="toggleTheme()" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-zinc-800 border border-slate-200 dark:border-zinc-800 transition-all active:scale-95 flex items-center justify-center">
          <span class="material-symbols-outlined text-xl" id="theme-icon">dark_mode</span>
        </button>

        <a href="dashboard.html" class="flex items-center gap-1.5 bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-700 dark:text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl border border-slate-200 dark:border-zinc-700 transition active:scale-95">
          <span class="material-symbols-outlined text-sm">dashboard</span>
          <span class="hidden sm:inline">Dashboard Admin</span>
        </a>

        <button onclick="logoutAdmin()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-900/40 text-xs font-semibold px-3 py-2 rounded-xl transition active:scale-95 flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">logout</span>
          <span class="hidden sm:inline">Keluar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Scanner Interface -->
  <main class="w-full max-w-md mx-auto px-4 py-6 flex-grow flex flex-col justify-center">
    
    <!-- Outer Card Viewport -->
    <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 border border-slate-200 dark:border-zinc-800 shadow-xl space-y-4 transition-all">
      
      <!-- Judul Box -->
      <div class="text-center">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white">Scan QR Code Absensi</h2>
        <p class="text-xs text-slate-400 dark:text-zinc-500 mt-0.5">Arahkan QR Code Kartu Siswa ke Kamera</p>
      </div>

      <!-- FITUR TAMBAHAN 1: SELECT PILIHAN KAMERA UTAMA HP -->
      <div class="flex items-center gap-2 bg-slate-100 dark:bg-zinc-950 p-2 rounded-xl border border-slate-200 dark:border-zinc-800">
        <span class="material-symbols-outlined text-slate-400 text-sm ml-1">photo_camera</span>
        <select id="camera-select" onchange="changeCameraDevice(this.value)" class="w-full bg-transparent text-xs font-bold text-slate-700 dark:text-slate-300 focus:outline-none border-none p-0 cursor-pointer">
          <option value="">Memuat daftar kamera HP...</option>
        </select>
      </div>

      <!-- Camera Viewport Box -->
      <div id="reader" class="overflow-hidden rounded-2xl bg-slate-950 min-h-[300px] sm:min-h-[330px] flex items-center justify-center relative shadow-inner border border-slate-200 dark:border-zinc-800">
        
        <!-- Controls Atas -->
        <div class="absolute top-3 left-3 right-3 z-20 flex justify-between items-center pointer-events-auto">
          <button id="torch-btn" onclick="toggleTorch()" class="p-2 rounded-full bg-slate-900/60 backdrop-blur-md text-slate-300 hover:text-white border border-white/10 transition active:scale-95">
            <span class="material-symbols-outlined text-base">flashlight_on</span>
          </button>
          
          <button id="flip-camera-btn" onclick="flipCamera()" class="p-2 rounded-full bg-slate-900/60 backdrop-blur-md text-slate-300 hover:text-white border border-white/10 transition active:scale-95">
            <span class="material-symbols-outlined text-base">cameraswitch</span>
          </button>
        </div>

        <!-- Tombol Awal Kamera -->
        <div id="start-camera-btn" onclick="startScannerWithGesture()" class="absolute inset-0 z-30 flex flex-col items-center justify-center gap-3 bg-slate-950/90 text-center p-6 cursor-pointer group">
          <div class="w-14 h-14 rounded-2xl bg-teal-500/10 text-teal-400 flex items-center justify-center border border-teal-500/20 group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-3xl">camera_alt</span>
          </div>
          <span class="text-xs font-bold text-white">Klik untuk Mulai Scanner</span>
        </div>

        <!-- Frame Pojok Hijau Laser -->
        <div id="scan-frame" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-[220px] h-[220px] sm:w-[240px] sm:h-[240px] pointer-events-none hidden">
          <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-emerald-400 rounded-tl-xl"></div>
          <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-emerald-400 rounded-tr-xl"></div>
          <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-emerald-400 rounded-bl-xl"></div>
          <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-emerald-400 rounded-br-xl"></div>
          <div id="scan-line" class="absolute left-2 right-2 h-0.5 bg-emerald-400 shadow-lg shadow-emerald-400/50 rounded-full"></div>
        </div>
      </div>

      <!-- FITUR TAMBAHAN 2: TOMBOL IMPORT MANUAL DARI GALERI -->
      <div class="pt-1">
        <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanFromFile(this)">
        <button onclick="document.getElementById('qr-input-file').click()" class="w-full py-2.5 px-4 rounded-xl bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 text-slate-700 dark:text-slate-300 text-xs font-bold border border-slate-200 dark:border-zinc-700 transition active:scale-95 flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-base text-teal-600 dark:text-teal-400">upload_file</span>
          Upload / Import Gambar QR dari Galeri
        </button>
      </div>

      <!-- KOTAK STATUS NOTIFIKASI -->
      <div id="status-box" class="hidden p-4 rounded-xl text-center font-semibold text-xs transition-all duration-300 shadow-sm border">
        <p id="status-text"></p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs font-mono text-slate-400 dark:text-zinc-600">
    &copy; 2026 E-Absensi Sentera System
  </footer>

  <!-- SCRIPT -->
  <script src="config.js"></script>
  <script src="scanner.js"></script>

  <script>
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-icon').textContent = 'light_mode';
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('theme-icon').textContent = 'dark_mode';
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
    }

    function logoutAdmin() {
      localStorage.clear();
      window.location.replace("index.html");
    }

    document.addEventListener("DOMContentLoaded", function() {
      initTheme();
      startScannerWithGesture();
    });
  </script>
</body>
</html>
